[project]
name = "easyeda-mcp-pro"
version = "2.0.0a1"
description = "Python-first MCP server for EasyEDA Pro"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = ["mcp>=2.0,<3", "websockets>=15,<16", "pydantic>=2.7,<3"]

[project.optional-dependencies]
engineering = ["shapely>=2.0,<3", "numpy>=2.0,<3", "scipy>=1.13,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
easyeda-mcp-pro = "easyeda_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
